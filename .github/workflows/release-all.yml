name: Release All Utilities

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag. If empty, upload build bundle as run artifact only.
        required: false
        default: ""
        type: string
      release_name:
        description: Optional GitHub release title (used only when tag is provided)
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-all:
    runs-on: macos-latest
    env:
      APPLICATION_IDENTITY: "Developer ID Application: METALBEAR TECH LTD (8W42TQ6PFA)"
      BUNDLE_PREFIX: com.metalbear
      ARCHIVE_PREFIX: apple-utils
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: metalbear-co/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable

      - name: Select Xcode version
        run: |
          set -euo pipefail
          xcode_app="$(ls -1d /Applications/Xcode*.app | sort -V | tail -n 1)"
          if [[ -z "${xcode_app}" ]]; then
            echo "No Xcode app found in /Applications"
            exit 1
          fi
          sudo xcode-select -s "${xcode_app}/Contents/Developer"
          xcode-select -p
          xcodebuild -version

      - name: Import signing certificate
        uses: metalbear-co/import-codesign-certs@7f43a75d5120d645e67d471d678ccbff1d140cd6
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Install build dependencies
        run: brew install xz

      - name: Build all public-SDK-safe binaries
        run: |
          set -euo pipefail
          chmod +x scripts/build-apple-utils.sh scripts/sign-built-utils.sh scripts/package-release-licenses.sh
          make all

      - name: Upload build logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          if-no-files-found: ignore
          path: |
            out/build-report.tsv
            out/excluded-targets.tsv
            out/binaries.tsv
            out/fail-logs

      - name: Sign built binaries
        run: |
          set -euo pipefail
          ./scripts/sign-built-utils.sh "${APPLICATION_IDENTITY}" "${BUNDLE_PREFIX}"

      - name: Bundle license and notice files
        run: |
          set -euo pipefail
          ./scripts/package-release-licenses.sh

      - name: Package release tarball
        id: package
        run: |
          set -euo pipefail
          archive_suffix="${{ inputs.tag }}"
          if [[ -z "${archive_suffix}" ]]; then
            archive_suffix="run-${GITHUB_RUN_ID}"
          fi
          archive_name="${ARCHIVE_PREFIX}-${archive_suffix}.tar.gz"
          tar -C out/release-package -czf "${archive_name}" .
          if [[ -n "${{ inputs.tag }}" ]]; then
            release_name="${{ inputs.release_name }}"
            if [[ -z "${release_name}" ]]; then
              release_name="apple utils ${{ inputs.tag }}"
            fi
            echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"
          fi
          echo "archive_name=${archive_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: ${{ steps.package.outputs.archive_name }}

      - name: Publish GitHub release
        if: ${{ inputs.tag != '' }}
        uses: metalbear-co/action-gh-release@ab50eebb6488051c6788d97fa95232267c6a4e23
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ steps.package.outputs.release_name }}
          files: |
            ${{ steps.package.outputs.archive_name }}
            out/binaries.tsv
            out/build-report.tsv
            out/excluded-targets.tsv
            out/signed-binaries.tsv
          generate_release_notes: true
